name: ci

on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
        working-directory: server
      # A release tag must match the package versions and have a CHANGELOG section (cut releases with scripts/release.mjs).
      - name: Tag matches package versions
        if: github.ref_type == 'tag'
        run: node scripts/ci-version.mjs check "${GITHUB_REF_NAME#v}"

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # GHCR requires a lowercase repository name (this repo has capital letters).
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # tag v1.2.3 -> "1.2.3"; any other push -> "<package version>-dev+<sha>"
      - name: App version
        id: ver
        run: echo "version=$(node scripts/ci-version.mjs build)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # "latest" is the newest stable release (not main, not a prerelease); "edge" follows main.
          flavor: latest=false
          tags: |
            type=edge,branch=main
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref_name, 'v0.') }}
            type=sha,format=short

      # Build once for the runner's architecture and actually run it, so a broken image never gets pushed.
      - name: Build (amd64) for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ipam:smoke
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.version }}
            APP_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name ipam -p 8080:8080 ipam:smoke
          for i in $(seq 1 30); do
            curl -fs http://localhost:8080/api/health && break
            sleep 1
          done
          curl -fs http://localhost:8080/api/health | grep -q '"ok":true'
          curl -fs http://localhost:8080/api/me | grep -q registration_open
          curl -fs http://localhost:8080/api/me | grep -q '"version":"${{ steps.ver.outputs.version }}"'
          curl -fs http://localhost:8080/ | grep -q '<title>simpleIPAM'
          # first account becomes the administrator
          curl -fs -X POST http://localhost:8080/api/auth/register -H 'content-type: application/json' \
            -d '{"username":"ci-admin","password":"ci-password-123"}' | grep -q '"global_role":"admin"'
          docker logs ipam
          [ "$(docker inspect -f '{{.State.Health.Status}}' ipam)" != "unhealthy" ]

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.version }}
            APP_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # GitHub Release for tags, with the CHANGELOG section as notes (after the image is published).
  release:
    if: github.ref_type == 'tag'
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          node scripts/ci-version.mjs notes "$version" > notes.md
          flags=""
          case "$version" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --title "simpleIPAM $version" --notes-file notes.md --verify-tag $flags
